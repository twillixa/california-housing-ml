name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Results are pinned to four decimals on macOS; Linux BLAS shifts the tree models slightly.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
